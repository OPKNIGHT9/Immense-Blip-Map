<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blip Map</title>
    <meta name="description" content="Interactive server location map." />
    <meta name="theme-color" content="#0a0a0c" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0a0c'/%3E%3Cpath d='M16 6a6 6 0 0 1 6 6c0 4.5-6 12-6 12S10 16.5 10 12a6 6 0 0 1 6-6Z' fill='none' stroke='%2322c55e' stroke-width='2.2'/%3E%3C/svg%3E"
    />
    <!-- Bump ?v= on every asset below whenever you change a file. Without
         it, browsers keep serving the previous version from cache and your
         changes appear not to have deployed. -->
    <link rel="stylesheet" href="vendor/leaflet/leaflet.css?v=2" />
    <link rel="stylesheet" href="css/styles.css?v=2" />
  </head>
  <body>
    <div id="toasts" class="toast-container"></div>

    <div class="app">
      <aside class="sidebar">
        <header class="sidebar-header">
          <div class="brand">
            <span class="brand-icon" data-icon="map-pin" data-size="18"></span>
            <div class="brand-text">
              <strong id="site-name">Blip Map</strong>
              <span id="tagline"></span>
            </div>
          </div>
          <a class="header-link" id="header-link" target="_blank" rel="noreferrer" title="Open link">
            <span data-icon="external" data-size="15"></span>
          </a>
        </header>

        <div class="search-box">
          <span class="search-icon" data-icon="search" data-size="15"></span>
          <input type="text" id="search" placeholder="Search locations..." autocomplete="off" />
        </div>

        <div class="nav-tree" id="nav-tree"></div>

        <div class="split-handle" id="split-handle" title="Drag to resize &bull; double-click to reset">
          <span class="split-grip"></span>
        </div>

        <div class="list-header">
          <span id="blip-count">0 locations</span>
        </div>

        <div class="blip-list" id="blip-list"></div>

        <div class="sidebar-footer">
          <div id="account"></div>
          <p class="footer-note" id="footer-note"></p>
        </div>
      </aside>

      <main class="map-wrapper">
        <div class="map" id="map"></div>

        <div class="map-controls">
          <button class="map-btn" id="btn-pins" title="Show or hide blips">
            <span data-icon="map-pin" data-size="15"></span>
          </button>
          <button class="map-btn" id="btn-zones" title="Show or hide zones">
            <span data-icon="polygon" data-size="15"></span>
          </button>
          <button class="map-btn" id="btn-connections" title="Toggle connector lines">
            <span data-icon="link" data-size="15"></span>
          </button>
          <button class="map-btn" id="btn-jump" title="Jump to coordinates (Ctrl+F)">
            <span data-icon="crosshair" data-size="15"></span>
          </button>
        </div>

        <div class="coords" id="coords" hidden></div>

        <div class="zoom-box" id="zoom-box">
          <span data-icon="zoom-in" data-size="13"></span>
          <button class="zoom-value" id="zoom-value">100%</button>
          <input type="text" class="zoom-input" id="zoom-input" hidden />
        </div>
      </main>
    </div>

    <div class="modal-overlay" id="modal-login" hidden>
      <div class="modal">
        <div class="modal-header">
          <h3>Member sign in</h3>
          <button class="modal-close" data-close="modal-login">
            <span data-icon="x" data-size="16"></span>
          </button>
        </div>
        <div class="modal-content">
          <p>Signing in reveals locations shared with your group.</p>
          <label class="field">
            <span>Username</span>
            <input type="text" id="login-user" autocomplete="username" />
          </label>
          <label class="field">
            <span>Password</span>
            <input type="password" id="login-pass" autocomplete="current-password" />
          </label>
          <div class="form-error" id="login-error" hidden></div>
        </div>
        <div class="modal-actions">
          <button class="btn secondary" data-close="modal-login">Cancel</button>
          <button class="btn primary" id="btn-do-login">Sign in</button>
        </div>
      </div>
    </div>

    <div class="modal-overlay" id="modal-jump" hidden>
      <div class="modal modal-small">
        <div class="modal-header">
          <h3>Jump to coordinates</h3>
          <button class="modal-close" data-close="modal-jump">
            <span data-icon="x" data-size="16"></span>
          </button>
        </div>
        <div class="modal-content">
          <p>Paste a pair of coordinates, or a whole vector3 into the X field.</p>
          <div class="field-row">
            <label class="field">
              <span>X</span>
              <input type="text" id="jump-x" placeholder="195.0" autocomplete="off" />
            </label>
            <label class="field">
              <span>Y</span>
              <input type="text" id="jump-y" placeholder="-934.0" autocomplete="off" />
            </label>
          </div>
        </div>
        <div class="modal-actions">
          <button class="btn secondary" data-close="modal-jump">Cancel</button>
          <button class="btn primary" id="btn-do-jump">Jump</button>
        </div>
      </div>
    </div>

    <script src="vendor/leaflet/leaflet.js?v=2"></script>
    <script src="data/config.js?v=2"></script>
    <script src="data/blips.js?v=2"></script>
    <script src="data/users.js?v=2"></script>
    <script src="js/icons.js?v=2"></script>
    <script src="js/crypto.js?v=2"></script>
    <script src="js/app.js?v=2"></script>
  </body>
</html>
